name: Genuin Superset image

# Publishes only on a release tag (genuin-*) or a manual run, never on a plain push.
on:
  push:
    tags: ["genuin-*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vedant1599/superset # GHCR names must be lowercase

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: superset-frontend/.nvmrc
          cache: npm
          cache-dependency-path: superset-frontend/package-lock.json

      - name: Build frontend
        working-directory: superset-frontend
        run: |
          npm ci
          npm run build

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=4.1.1-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: superset/static/assets
          file: docker/genuin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
